<source __IP__>
	always-allow-relaying yes         # allow feeding for defined users
	process-x-virtual-mta yes         # allow selection of a VirtualMTA
	process-x-envid yes               # allow x-envid
	process-x-job yes         		  # allow x-job
	max-message-size unlimited        # 0 implies no cap, in bytes
	smtp-service yes          		  # allow SMTP service
    add-received-header no
	allow-mailmerge yes
	remove-header app
</source>
